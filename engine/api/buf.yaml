version: v2

# Lint rules — DEFAULT covers the standard Buf set.
# FIELD_NOT_REQUIRED and PACKAGE_VERSION_SUFFIX are excluded because the
# proto intentionally omits version suffixes (internal API, not public BSR).
lint:
  use:
    - DEFAULT
  except:
    - FIELD_NOT_REQUIRED
    - PACKAGE_VERSION_SUFFIX

# Breaking-change detection at the FILE level.
# This prevents any field number renumbering, type changes, or field removal
# that would break the serialised QuoteResponse bytes stored in orders.quote_data.
breaking:
  use:
    - FILE
