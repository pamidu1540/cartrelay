<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">CartRelay</title>
  <desc id="desc">A self-hosted ecommerce platform with a Telegram storefront, built with Go, Python, and PostgreSQL.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#14383e"/></linearGradient>
  </defs>
  <rect width="1200" height="280" rx="20" fill="url(#background)"/>
  <circle cx="1100" cy="20" r="190" fill="#34d399" opacity=".06"/>
  <rect x="56" y="70" width="140" height="140" rx="32" fill="#34d399"/>
  <g fill="none" stroke="#0f172a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M82 108h14l13 48h47l14-35h-66"/>
    <path d="M132 94h35m-11-11 11 11-11 11"/>
    <circle cx="116" cy="177" r="5"/><circle cx="152" cy="177" r="5"/>
  </g>
  <text x="232" y="126" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="58" font-weight="700">CartRelay</text>
  <text x="236" y="169" fill="#cbd5e1" font-family="Segoe UI,Arial,sans-serif" font-size="23">Your store. Your backend. Inside Telegram.</text>
  <text x="236" y="212" fill="#6ee7b7" font-family="Segoe UI,Arial,sans-serif" font-size="16" letter-spacing="1.5">GO / PYTHON / POSTGRESQL / SELF-HOSTED</text>
</svg>
