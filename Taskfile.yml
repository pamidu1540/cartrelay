version: '3'

env:
  PATH: '{{.ROOT_DIR}}/.tools/bin:{{.PATH}}'
  UV_PROJECT_ENVIRONMENT: '{{.ROOT_DIR}}/.tools/.venv'

tasks:
  setup:
    desc: Set up Python development dependencies (requires uv and Go)
    cmds:
      - task: setup-python

  setup-python:
    desc: Install Python 3.13 development dependencies
    cmds:
      - uv sync --directory bot --python 3.13 --all-extras --locked

  lint:
    desc: Check Go and Python source
    cmds:
      - task: vet-engine
      - task: vet-supervisor
      - uv run --directory bot --locked ruff check src tests

  vet-engine:
    dir: engine
    cmds: [go vet ./...]

  vet-supervisor:
    dir: supervisor
    cmds: [go vet ./...]

  test:
    desc: Run unit tests (database tests need a disposable TEST_DATABASE_URL)
    cmds:
      - task: test-engine
      - task: test-supervisor
      - uv run --directory bot --locked pytest tests

  test-engine:
    dir: engine
    cmds: [go test ./...]

  test-supervisor:
    dir: supervisor
    cmds: [go test ./...]

  build:
    desc: Build native engine and CartRelay CLI into bin/
    cmds:
      - task: build-engine
      - task: build-supervisor

  build-engine:
    dir: engine
    cmds: [go build -o ../bin/ ./...]

  build-supervisor:
    dir: supervisor
    cmds:
      - 'go build -o ../bin/cartrelay{{if eq OS "windows"}}.exe{{end}} .'

  env:
    desc: Show configuration setup instructions
    cmds:
      - 'echo "Use local_test/.env.example with your secret manager. Never commit credentials. See README.md."'

  up:
    desc: Start the development store using local_test/.env or shell variables
    dir: local_test
    cmds:
      - docker compose up --build -d

  down:
    desc: Stop the development store and preserve data
    dir: local_test
    cmds:
      - docker compose down
