version: '3'

env:
  PATH: '{{.USER_WORKING_DIR}}/.tools/bin:{{.PATH}}'

tasks:
  setup:
    desc: "Download and bootstrap all necessary development tools into .tools/bin"
    cmds:
      - powershell -Command "New-Item -ItemType Directory -Force -Path .tools\bin | Out-Null"
      - go env -w GOBIN="{{.USER_WORKING_DIR}}\.tools\bin"
      - go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
      - go install github.com/securego/gosec/v2/cmd/gosec@latest
      - powershell -Command "Invoke-WebRequest -Uri https://github.com/astral-sh/uv/releases/latest/download/uv-x86_64-pc-windows-msvc.zip -OutFile uv.zip"
      - powershell -Command "Expand-Archive uv.zip -DestinationPath .tools\bin -Force"
      - powershell -Command "Remove-Item uv.zip"
      - task: setup-python

  setup-python:
    desc: "Set up the Python virtual environment and install dependencies"
    env:
      UV_PROJECT_ENVIRONMENT: "{{.USER_WORKING_DIR}}/.tools/.venv"
    cmds:
      - .tools/bin/uv sync --directory bot --all-extras

  lint:
    desc: "Run static analysis and linting (Go, Python, Docker)"
    env:
      UV_PROJECT_ENVIRONMENT: "{{.USER_WORKING_DIR}}/.tools/.venv"
    cmds:
      - cd engine && ../.tools/bin/golangci-lint run ./...
      - cd supervisor && ../.tools/bin/golangci-lint run ./...
      - .tools/bin/uv run --directory bot ruff check src
      - docker run --rm -i hadolint/hadolint < engine/Dockerfile || true
      - docker run --rm -i hadolint/hadolint < bot/Dockerfile || true

  test:
    desc: "Run test suites (Go and Python)"
    env:
      UV_PROJECT_ENVIRONMENT: "{{.USER_WORKING_DIR}}/.tools/.venv"
    cmds:
      - cd engine && go test -v ./...
      - cd supervisor && go test -v ./...
      - .tools/bin/uv run --directory bot pytest tests

  build:
    desc: "Build Engine and Supervisor"
    cmds:
      - cd engine && go build -o ../bin/engine.exe .
      - cd supervisor && go build -o ../bin/logistics.exe .

  env:
    desc: "Generate local_test/.env interactively"
    cmds:
      - powershell -Command "$BotToken = Read-Host 'Enter Telegram Bot Token'; $Admin = Read-Host 'Enter Admin User ID'; $Internal = -join ((48..57) + (97..122) | Get-Random -Count 32 | % {[char]$_}); $Content = \"TELEGRAM_BOT_TOKEN=$BotToken`nINTERNAL_TOKEN=$Internal`nADMIN_USER_IDS=$Admin`nDEPLOY_ENV=local_dev`nPOSTGRES_USER=postgres`nPOSTGRES_PASSWORD=postgres`nPOSTGRES_DB=logistics\"; Set-Content local_test/.env $Content"

  up:
    desc: "Start local development stack"
    dir: local_test
    cmds:
      - docker compose up --build -d

  down:
    desc: "Stop local development stack"
    dir: local_test
    cmds:
      - docker compose down
