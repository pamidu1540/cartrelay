[project]
name = "logistics-bot"
version = "5.0.0"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot[job-queue]==21.10",
    "grpcio==1.69.0",
    "grpcio-tools==1.69.0",
    "protobuf==5.29.3",
    "anyio==4.7.0",
    "structlog==24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
exclude = ["src/api"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
