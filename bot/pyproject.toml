[project]
name = "cartrelay-bot"
description = "Telegram storefront for the CartRelay ecommerce platform"
license = "MIT"
version = "12.8.0"
requires-python = ">=3.13"
dependencies = [
    "python-telegram-bot[job-queue]>=22.7.0",
    "grpcio>=1.80.0",
    "protobuf>=6.31.1,<7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "ruff>=0.8",
    "mypy>=1.13",
    "grpcio-tools>=1.80.0",
]

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
exclude = ["src/api"]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501", "I001"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
