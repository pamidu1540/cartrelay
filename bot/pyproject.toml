[project]
name = "logistics-bot"
version = "4.0.0"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot[callback-data]>=21.3",
    "grpcio==1.80.0",        # Must match the version used to generate logistics_pb2_grpc.py
    "grpcio-tools==1.80.0",  # Keeps re-generated stubs consistent with the installed runtime
    "protobuf>=5.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 120
target-version = "py312"
# Never lint generated proto files
exclude = [
    "src/api/logistics_pb2.py",
    "src/api/logistics_pb2_grpc.py",
    "src/api/__init__.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
