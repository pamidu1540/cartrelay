[project]
name = "logistics-bot"
version = "2.0.0"
description = "Telegram UI layer for Logistics Engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies =[
    "python-telegram-bot[job-queue]>=21.0.0",
    "grpcio>=1.62.1",
    "grpcio-tools>=1.62.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"