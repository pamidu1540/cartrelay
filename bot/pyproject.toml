[project]
name = "logistics-bot"
version = "4.0.0"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot[callback-data]>=21.3",
    "grpcio>=1.65.0",
    "grpcio-tools>=1.65.0",
    "protobuf>=5.27.0",
]

# Exposed as [dev] extras so CI can install with:
#   pip install -e ".[dev]"
# The old [tool.uv] table was uv-specific and invisible to standard pip.
[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
