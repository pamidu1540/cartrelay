name: CI

# ─────────────────────────────────────────────────────────────────────────────
# DESIGN: You push source code only. This workflow handles everything else.
#
# What you push:          What CI auto-generates & commits back:
#   engine/*.go             engine/go.sum          (go mod tidy)
#   engine/go.mod           engine/api/*.pb.go     (protoc)
#   engine/api/*.proto      supervisor/go.sum      (go mod tidy)
#   supervisor/*.go         bot/src/api/*_pb2*.py  (protoc)
#   supervisor/go.mod
#   bot/src/*.py
#   bot/pyproject.toml
#
# Jobs run in order:   prep → validate → docker
# Each job checks out ref:main so it always sees prep's committed output.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
    # [skip ci] commits from the prep job never re-trigger this workflow.
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io
  IMAGE_ENGINE: ghcr.io/${{ github.repository }}/engine
  IMAGE_BOT:    ghcr.io/${{ github.repository }}/bot

# One run at a time per branch. Cancel the previous run if a new push arrives
# before it finishes — no point validating stale code.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ─── Job 1: PREP ─────────────────────────────────────────────────────────────
# Runs go mod tidy on both modules, regenerates all proto bindings, then
# commits and pushes the result back to main. The [skip ci] tag on that commit
# prevents an infinite loop.
#
# If nothing changed (already tidy, proto unchanged) the commit step is a
# no-op and the rest of the pipeline runs immediately on the original commit.
jobs:
  prep:
    name: Prep — tidy modules + generate proto
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Fetch full history so git push succeeds even after a force-push
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          # Cache against go.mod files — go.sum may not yet be correct
          cache-dependency-path: |
            engine/go.mod
            supervisor/go.mod

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install protoc + Go plugins
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Install Python gRPC tools
        run: pip install --quiet grpcio-tools

      # ── go mod tidy ──────────────────────────────────────────────────────
      # Resolves any missing or stale go.sum entries introduced by changes to
      # go.mod or newly generated *.pb.go files that import newer package versions.
      - name: go mod tidy — engine
        working-directory: engine
        run: go mod tidy

      - name: go mod tidy — supervisor
        working-directory: supervisor
        run: go mod tidy

      # ── Proto generation ─────────────────────────────────────────────────
      # Regenerates Go + Python bindings whenever logistics.proto changes.
      # If the proto hasn't changed, the output is identical and git sees no diff.
      - name: Generate Go proto bindings
        run: |
          protoc --proto_path=engine/api \
            --go_out=engine/api     --go_opt=paths=source_relative \
            --go-grpc_out=engine/api --go-grpc_opt=paths=source_relative \
            engine/api/logistics.proto

      - name: Generate Python proto bindings
        run: |
          mkdir -p bot/src/api
          python -m grpc_tools.protoc \
            -Iengine/api \
            --python_out=bot/src/api \
            --grpc_python_out=bot/src/api \
            engine/api/logistics.proto
          touch bot/src/api/__init__.py
          # Fix grpcio-tools known bug: generated file uses absolute import
          # which breaks Python 3 package resolution.
          sed -i 's/^import logistics_pb2/from . import logistics_pb2/' \
            bot/src/api/logistics_pb2_grpc.py

      # ── Commit back ──────────────────────────────────────────────────────
      # Stages every generated / updated file. If git sees no diff (everything
      # was already up to date), skips the commit entirely.
      # [skip ci] prevents this commit from re-triggering the workflow.
      - name: Commit generated files back to main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add \
            engine/go.sum \
            engine/go.mod \
            engine/api/logistics.pb.go \
            engine/api/logistics_grpc.pb.go \
            supervisor/go.sum \
            supervisor/go.mod \
            bot/src/api/logistics_pb2.py \
            bot/src/api/logistics_pb2_grpc.py \
            bot/src/api/__init__.py

          if git diff --staged --quiet; then
            echo "Nothing to commit — all generated files are already up to date."
          else
            git commit -m "chore: auto-update generated files [skip ci]"
            git push origin main
          fi

# ─── Job 2: VALIDATE ─────────────────────────────────────────────────────────
# Checks out the HEAD of main AFTER prep may have committed back changes.
# Runs build, vet, test, lint, and vulnerability scan on the fully-generated code.
  validate:
    name: Validate — build, test, lint, vulns
    runs-on: ubuntu-latest
    needs: prep

    steps:
      # ref: main ensures we get prep's committed output, not the original SHA.
      - name: Checkout (post-prep HEAD)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: |
            engine/go.sum
            supervisor/go.sum

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: bot/pyproject.toml

      # ── Go: engine ───────────────────────────────────────────────────────
      - name: go vet — engine
        working-directory: engine
        run: go vet ./...

      - name: go build — engine
        working-directory: engine
        run: go build -ldflags="-X main.Version=ci-${{ github.sha }}" ./...

      - name: go test — engine
        working-directory: engine
        run: |
          if find . -name '*_test.go' | grep -q .; then
            go test -v -race ./...
          else
            echo "No tests yet — skipping."
          fi

      # ── Go: supervisor ───────────────────────────────────────────────────
      - name: go vet — supervisor
        working-directory: supervisor
        run: go vet ./...

      - name: go build — supervisor
        working-directory: supervisor
        run: go build -ldflags="-X main.Version=ci-${{ github.sha }}" ./...

      - name: go test — supervisor
        working-directory: supervisor
        run: |
          if find . -name '*_test.go' | grep -q .; then
            go test -v -race ./...
          else
            echo "No tests yet — skipping."
          fi

      # ── Python: bot ──────────────────────────────────────────────────────
      - name: Install bot dependencies
        working-directory: bot
        run: |
          pip install --quiet -e ".[dev]"
          # grpc stubs needed for ruff import resolution
          pip install --quiet grpcio grpcio-tools

      - name: ruff lint — bot
        working-directory: bot
        run: ruff check src/ --output-format=github

      - name: pytest — bot
        working-directory: bot
        run: |
          if [ -d tests ]; then pytest tests/ -v; else echo "No tests yet."; fi

      # ── Vulnerability scan ───────────────────────────────────────────────
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: govulncheck — engine
        working-directory: engine
        run: govulncheck ./...

      - name: govulncheck — supervisor
        working-directory: supervisor
        run: govulncheck ./...

# ─── Job 3: DOCKER ───────────────────────────────────────────────────────────
# Builds and pushes images to GHCR only when validate passes.
# Uses the same ref:main so it always builds the fully-generated, tidy code.
  docker:
    name: Docker — build & push to GHCR
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout (post-prep HEAD)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare CI .env
        working-directory: deploy
        run: |
          cp .env.example .env
          sed -i 's|^TELEGRAM_BOT_TOKEN=.*|TELEGRAM_BOT_TOKEN=stub_ci_token|'                      .env
          sed -i 's|^INTERNAL_TOKEN=.*|INTERNAL_TOKEN=stub_ci_internal_00000000000000000000|'       .env
          sed -i 's|^MAPBOX_TOKEN=.*|MAPBOX_TOKEN=stub_ci_mapbox|'                                 .env
          sed -i 's|^ADMIN_USER_IDS=.*|ADMIN_USER_IDS=123456789|'                                  .env
          sed -i 's|^BUILD_VERSION=.*|BUILD_VERSION=${{ github.sha }}|'                            .env
          sed -i 's|^# DEV_BYPASS_SECRET=.*|DEV_BYPASS_SECRET=stub_ci_bypass_secret_32chars000|'   .env
          sed -i 's|^# SKIP_LICENSE_CHECK=.*|SKIP_LICENSE_CHECK=stub_ci_bypass_secret_32chars000|' .env

      - name: Build & push engine image
        uses: docker/build-push-action@v6
        with:
          context: engine
          file: engine/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_ENGINE }}:main
            ${{ env.IMAGE_ENGINE }}:${{ github.sha }}
          build-args: BUILD_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push bot image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: bot/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BOT }}:main
            ${{ env.IMAGE_BOT }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
