name: CartRelay CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [engine, supervisor]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: '${{ matrix.module }}/go.sum'
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...

  bot:
    name: Python storefront
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --directory bot --all-extras --locked
      - run: uv run --directory bot --locked ruff check src tests
      - run: uv run --directory bot --locked pytest tests -q

  containers:
    name: Container build and installer syntax
    runs-on: ubuntu-latest
    needs: [go, bot]
    steps:
      - uses: actions/checkout@v4
      - run: bash -n install.sh
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: engine/Dockerfile
          push: false
          cache-from: type=gha,scope=engine
          cache-to: type=gha,mode=max,scope=engine
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: bot/Dockerfile
          push: false
          cache-from: type=gha,scope=bot
          cache-to: type=gha,mode=max,scope=bot
