name: Extreme Load Test & Report

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "Load scenario to run"
        required: true
        default: "full"
        type: choice
        options:
          - full
          - grpc-only
          - sqlite-only
          - spike
      max_users:
        description: "Peak concurrent users"
        required: true
        default: "256"
      duration_seconds:
        description: "Sustained load duration (seconds)"
        required: true
        default: "60"
  schedule:
    # Run every night at 02:00 UTC
    - cron: "0 2 * * *"

jobs:
  load-test:
    name: Load Test (${{ github.event.inputs.scenario || 'full' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SCENARIO:         ${{ github.event.inputs.scenario || 'full' }}
      MAX_USERS:        ${{ github.event.inputs.max_users || '256' }}
      DURATION_SECS:    ${{ github.event.inputs.duration_seconds || '60' }}
      INTERNAL_TOKEN:   load-test-token-ci
      TELEGRAM_BOT_TOKEN: "0:not-used-in-load-test"
      MAPBOX_TOKEN:     "pk.not-used-in-load-test"
      DEV_BYPASS_SECRET: ci-bypass-secret
      SKIP_LICENSE_CHECK: ci-bypass-secret
      PYTHONPATH: bot/src

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Tooling ──────────────────────────────────────────────────────────────
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          pip install grpcio grpcio-tools aiohttp pytest-asyncio \
                      matplotlib pandas jinja2 --quiet

      - name: Install ghz (gRPC load tester)
        run: |
          GHZ_VERSION=0.120.0
          curl -sSL \
            "https://github.com/bojand/ghz/releases/download/v${GHZ_VERSION}/ghz-linux-x86_64.tar.gz" \
            | tar -xz -C /usr/local/bin ghz
          ghz --version

      # ── Build & start stack ───────────────────────────────────────────────────
      - name: Write .env
        run: |
          cat > deploy/.env <<EOF
          TELEGRAM_BOT_TOKEN=${{ env.TELEGRAM_BOT_TOKEN }}
          INTERNAL_TOKEN=${{ env.INTERNAL_TOKEN }}
          MAPBOX_TOKEN=${{ env.MAPBOX_TOKEN }}
          DEV_BYPASS_SECRET=${{ env.DEV_BYPASS_SECRET }}
          SKIP_LICENSE_CHECK=${{ env.SKIP_LICENSE_CHECK }}
          EOF

      - name: Build & start Docker Compose stack
        run: |
          cd deploy
          docker compose up -d --build
          echo "Waiting for engine to be ready..."
          for i in $(seq 1 30); do
            if docker compose exec -T engine grpc_health_probe \
                -addr=localhost:50051 2>/dev/null; then
              echo "Engine healthy after ${i}s"
              break
            fi
            sleep 2
          done

      - name: Seed test data
        run: |
          python3 load_test/scripts/seed_data.py \
            --token "${{ env.INTERNAL_TOKEN }}" \
            --items 50 \
            --users 500

      # ── Run load tests ────────────────────────────────────────────────────────
      - name: Run gRPC engine load test (ghz)
        if: env.SCENARIO == 'full' || env.SCENARIO == 'grpc-only'
        run: |
          mkdir -p load_test/results
          python3 load_test/scripts/run_grpc_load.py \
            --token "${{ env.INTERNAL_TOKEN }}" \
            --max-users "${{ env.MAX_USERS }}" \
            --duration "${{ env.DURATION_SECS }}" \
            --output load_test/results/grpc_results.json

      - name: Run SQLite contention test
        if: env.SCENARIO == 'full' || env.SCENARIO == 'sqlite-only'
        run: |
          mkdir -p load_test/results
          python3 load_test/scripts/run_sqlite_stress.py \
            --writers 100 \
            --writes-each 50 \
            --output load_test/results/sqlite_results.json

      - name: Run spike test (0→500 users in 5s)
        if: env.SCENARIO == 'full' || env.SCENARIO == 'spike'
        run: |
          mkdir -p load_test/results
          python3 load_test/scripts/run_spike_test.py \
            --peak-users "${{ env.MAX_USERS }}" \
            --ramp-seconds 5 \
            --token "${{ env.INTERNAL_TOKEN }}" \
            --output load_test/results/spike_results.json



      # ── Collect engine metrics ────────────────────────────────────────────────
      - name: Collect Docker & engine metrics
        if: always()
        run: |
          mkdir -p load_test/results
          docker stats --no-stream --format json > load_test/results/docker_stats.json || true
          docker compose -f deploy/docker-compose.yml logs --no-color > \
            load_test/results/engine_logs.txt 2>&1 || true
          python3 load_test/scripts/parse_engine_logs.py \
            --input  load_test/results/engine_logs.txt \
            --output load_test/results/log_metrics.json || true

      # ── Generate HTML report ──────────────────────────────────────────────────
      - name: Generate HTML report
        if: always()
        run: |
          python3 load_test/scripts/generate_report.py \
            --results-dir load_test/results \
            --scenario    "${{ env.SCENARIO }}" \
            --max-users   "${{ env.MAX_USERS }}" \
            --duration    "${{ env.DURATION_SECS }}" \
            --commit      "${{ github.sha }}" \
            --run-id      "${{ github.run_id }}" \
            --output      load_test/results/report.html

      # ── GitHub Actions Job Summary ────────────────────────────────────────────
      - name: Write job summary
        if: always()
        run: |
          python3 load_test/scripts/write_summary.py \
            --results-dir load_test/results \
            >> $GITHUB_STEP_SUMMARY

      # ── Upload artifacts ──────────────────────────────────────────────────────
      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-report-${{ github.run_id }}
          path: load_test/results/
          retention-days: 30

      # ── Fail the job if thresholds breached ───────────────────────────────────
      - name: Assert thresholds
        run: |
          python3 load_test/scripts/assert_thresholds.py \
            --results-dir load_test/results \
            --p99-max-ms  1000 \
            --error-rate-max 0.01 \
            --sqlite-busy-max 5

      # ── Teardown ──────────────────────────────────────────────────────────────
      - name: Teardown stack
        if: always()
        run: |
          cd deploy && docker compose down -v
