name: Generate Python gRPC Bindings

# This action runs automatically whenever logistics.proto is modified
on:
  push:
    paths:
      - 'engine/api/logistics.proto'
  workflow_dispatch: # Allows you to run it manually from the Actions tab

jobs:
  generate-python-pb2:
    runs-on: ubuntu-latest
    
    # Grants the action permission to push code back to your repo
    permissions:
      contents: write 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12' # Matches your pyproject.toml

      - name: Install gRPC Tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install grpcio-tools

      - name: Compile Python Protobufs
        run: |
          # Ensure the target directory exists
          mkdir -p bot/src/api
          
          # Run the compiler
          python -m grpc_tools.protoc \
            -Iengine/api \
            --python_out=bot/src/api \
            --grpc_python_out=bot/src/api \
            engine/api/logistics.proto

      - name: Fix Python 3 Relative Import Bug
        run: |
          # grpcio-tools has a known bug where it doesn't use relative imports. 
          # This automatically patches logistics_pb2_grpc.py so it doesn't crash Python 3.
          sed -i 's/import logistics_pb2 as logistics__pb2/from . import logistics_pb2 as logistics__pb2/g' bot/src/api/logistics_pb2_grpc.py

      - name: Commit and Push Generated Files
        run: |
          # Configure Git as the GitHub Actions bot
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Add the generated files
          git add bot/src/api/logistics_pb2.py bot/src/api/logistics_pb2_grpc.py
          
          # Check if there are actually any changes to commit
          if git diff --staged --quiet; then
            echo "No changes in generated files. Skipping commit."
          else
            git commit -m "chore: auto-generate Python pb2 files from proto"
            git push
          fi
