name: CodeQL Analysis

# ─────────────────────────────────────────────────────────────────────────────
# Kept as a separate workflow because:
#   - It runs on a weekly schedule regardless of pushes
#   - It analyses PRs independently
#   - Results go to the GitHub Security tab (separate from CI green/red)
#   - GitHub's GHAS billing is per-language per-commit, not per-workflow
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
    paths:
      - 'engine/**'
      - 'supervisor/**'
      - 'bot/**'
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'   # Every Monday 06:00 UTC

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: python
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Always analyse the latest committed code including prep's output
          ref: main

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
