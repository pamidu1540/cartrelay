name: Docker Build

on:
  push:
    paths:
      - 'deploy/**'
      - 'engine/**'
      - 'bot/**'
      - '.github/workflows/docker-build.yml'
  pull_request:
    paths:
      - 'deploy/**'
      - 'engine/**'
      - 'bot/**'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Find compose file and set COMPOSE_DIR
        id: composedir
        run: |
          CF=$(find . -name 'docker-compose.yml' -o -name 'compose.yml' | head -1)
          if [ -z "$CF" ]; then
            echo "No docker-compose.yml found!" && exit 1
          fi
          DIR=$(dirname "$CF")
          echo "Found compose at: $DIR"
          echo "dir=$DIR" >> $GITHUB_OUTPUT

      - name: Create .env with stub values
        working-directory: ${{ steps.composedir.outputs.dir }}
        run: |
          # Start from example if it exists
          [ -f .env.example ] && cp .env.example .env || touch .env
          # Ensure all required vars are present (non-empty stubs)
          set_if_missing() {
            grep -qE "^${1}=" .env || echo "${1}=${2}" >> .env
          }
          set_if_missing TELEGRAM_BOT_TOKEN  "stub_token"
          set_if_missing INTERNAL_TOKEN      "stub_internal_32charsXXXXXXXXXX"
          set_if_missing MAPBOX_TOKEN        "stub_mapbox"
          set_if_missing DEV_BYPASS_SECRET   "stub_bypass"
          set_if_missing SKIP_LICENSE_CHECK  "stub_bypass"

      - name: Validate Compose config
        working-directory: ${{ steps.composedir.outputs.dir }}
        run: docker compose config --quiet

      - name: Build all services
        working-directory: ${{ steps.composedir.outputs.dir }}
        run: docker compose build --no-cache
