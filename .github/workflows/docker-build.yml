name: Docker Build

on:
  push:
    paths:
      - 'deploy/**'
      - 'engine/**'
      - 'bot/**'
      - '.github/workflows/docker-build.yml'
  pull_request:
    paths:
      - 'deploy/**'
      - 'engine/**'
      - 'bot/**'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env from example (or stub if missing)
        working-directory: deploy
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi
          # Inject dummy values for vars that must be non-empty
          grep -qE '^TELEGRAM_BOT_TOKEN=' .env || echo "TELEGRAM_BOT_TOKEN=stub" >> .env
          grep -qE '^INTERNAL_TOKEN=' .env     || echo "INTERNAL_TOKEN=stub-internal-token-32chars00000" >> .env
          grep -qE '^MAPBOX_TOKEN=' .env       || echo "MAPBOX_TOKEN=stub" >> .env
          grep -qE '^DEV_BYPASS_SECRET=' .env  || echo "DEV_BYPASS_SECRET=stub" >> .env
          grep -qE '^SKIP_LICENSE_CHECK=' .env || echo "SKIP_LICENSE_CHECK=stub" >> .env

      - name: Validate Compose config
        working-directory: deploy
        run: docker compose config --quiet

      - name: Build Docker images via Compose
        working-directory: deploy
        run: docker compose build --no-cache
