name: Docker Build

on:
  push:
    paths:
      - 'deploy/**'
      - 'engine/**'
      - 'bot/**'
      - '.github/workflows/docker-build.yml'
  pull_request:
    paths:
      - 'deploy/**'
      - 'engine/**'
      - 'bot/**'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare .env for CI
        working-directory: deploy
        run: |
          cp .env.example .env
          # Use sed to replace placeholder values — exact var names from .env.example
          sed -i 's|^TELEGRAM_BOT_TOKEN=.*|TELEGRAM_BOT_TOKEN=stub_ci_token|' .env
          sed -i 's|^INTERNAL_TOKEN=.*|INTERNAL_TOKEN=stub_ci_internal_00000000000000000000000000000000|' .env
          sed -i 's|^MAPBOX_TOKEN=.*|MAPBOX_TOKEN=stub_ci_mapbox|' .env
          sed -i 's|^ADMIN_USER_IDS=.*|ADMIN_USER_IDS=123456789|' .env
          sed -i 's|^BUILD_VERSION=.*|BUILD_VERSION=ci-test|' .env
          # Uncomment and set the license bypass vars (they are commented out by default)
          sed -i 's|^# DEV_BYPASS_SECRET=.*|DEV_BYPASS_SECRET=stub_ci_bypass_secret_32chars000|' .env
          sed -i 's|^# SKIP_LICENSE_CHECK=.*|SKIP_LICENSE_CHECK=stub_ci_bypass_secret_32chars000|' .env

      - name: Build engine image
        working-directory: deploy
        run: docker compose build engine --no-cache

      - name: Build bot image
        working-directory: deploy
        run: docker compose build bot --no-cache
