name: Docker Build

on:
  push:
    paths:
      - 'deploy/**'
      - 'engine/**'
      - 'bot/**'
      - '.github/workflows/docker-build.yml'
  pull_request:
    paths:
      - 'deploy/**'
      - 'engine/**'
      - 'bot/**'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Print repo structure (debug)
        run: |
          find . -name 'docker-compose.yml' -o -name 'compose.yml' -o -name 'docker-compose.yaml' | sort
          ls deploy/ || true

      - name: Create .env for CI
        # README says: cp deploy/.env.example deploy/.env
        # We do the same but with CI-safe stub values
        run: |
          if [ -f deploy/.env.example ]; then
            cp deploy/.env.example deploy/.env
          else
            touch deploy/.env
          fi
          # Override/add every var that compose requires to be non-empty
          cat >> deploy/.env << 'EOF'
          TELEGRAM_BOT_TOKEN=stub_ci_token
          INTERNAL_TOKEN=stub_ci_internal_32charsXXXXXX00
          MAPBOX_TOKEN=stub_ci_mapbox
          DEV_BYPASS_SECRET=stub_ci_bypass
          SKIP_LICENSE_CHECK=stub_ci_bypass
          EOF

      - name: Build Docker images via Compose
        # README says: cd deploy && docker compose up -d --build
        working-directory: deploy
        run: docker compose build --no-cache
