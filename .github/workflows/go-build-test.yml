name: Go Build & Test

on:
  push:
    paths:
      - 'engine/**'
      - 'supervisor/**'
      - '.github/workflows/go-build-test.yml'
  pull_request:
    paths:
      - 'engine/**'
      - 'supervisor/**'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-engine:
    name: Build engine (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: engine/go.sum

      - name: Download dependencies
        working-directory: engine
        run: go mod download

      - name: Verify dependencies unchanged
        working-directory: engine
        run: go mod verify

      - name: Build
        working-directory: engine
        run: go build ./...

      - name: Test
        working-directory: engine
        run: |
          if find . -name '*_test.go' | grep -q .; then
            go test -v -race ./...
          else
            echo "No tests found — skipping."
          fi

  build-supervisor:
    name: Build supervisor (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: supervisor/go.sum

      - name: Download dependencies
        working-directory: supervisor
        run: go mod download

      - name: Verify dependencies unchanged
        working-directory: supervisor
        run: go mod verify

      - name: Build
        working-directory: supervisor
        run: go build ./...

      - name: Test
        working-directory: supervisor
        run: |
          if find . -name '*_test.go' | grep -q .; then
            go test -v -race ./...
          else
            echo "No tests found — skipping."
          fi
