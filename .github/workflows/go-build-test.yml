name: Go Build & Test

on:
  push:
    paths:
      - 'engine/**'
      - '.github/workflows/go-build-test.yml'
  pull_request:
    paths:
      - 'engine/**'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          # Disable built-in cache — we manage it manually below to avoid
          # failing when go.sum does not yet exist in engine/
          cache: false

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('engine/go.sum', 'engine/go.mod') }}
          restore-keys: go-${{ runner.os }}-

      - name: Tidy & Download Dependencies
        working-directory: engine
        run: |
          go mod tidy
          go mod download
          go mod verify

      - name: Build
        working-directory: engine
        run: go build ./...

      - name: Run Tests
        working-directory: engine
        run: |
          if find . -name '*_test.go' | grep -q .; then
            go test -v -race -coverprofile=coverage.out ./...
          else
            echo "No test files found — skipping."
          fi

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: engine/coverage.out
          if-no-files-found: ignore
