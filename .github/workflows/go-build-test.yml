name: Go Build & Test

on:
  push:
    paths:
      - 'engine/**'
      - 'supervisor/**'
      - '.github/workflows/go-build-test.yml'
  pull_request:
    paths:
      - 'engine/**'
      - 'supervisor/**'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-engine:
    name: Build engine (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: engine/go.sum

      - name: Download dependencies
        working-directory: engine
        run: go mod download

      - name: Verify go.sum is tidy
        working-directory: engine
        run: |
          go mod tidy
          if ! git diff --quiet go.mod go.sum; then
            echo "go.mod or go.sum is out of date — run 'go mod tidy' and commit."
            git diff go.mod go.sum
            exit 1
          fi

      - name: Verify module graph
        working-directory: engine
        run: go mod verify

      # FIX: go vet catches format-string bugs, unreachable code, etc.
      - name: go vet
        working-directory: engine
        run: go vet ./...

      - name: Build
        working-directory: engine
        run: go build -ldflags="-X main.Version=ci-test" ./...

      - name: Test
        working-directory: engine
        run: |
          if find . -name '*_test.go' | grep -q .; then
            go test -v -race ./...
          else
            echo "No tests yet — skipping."
          fi

  build-supervisor:
    name: Build supervisor (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: supervisor/go.sum

      - name: Download dependencies
        working-directory: supervisor
        run: go mod download

      - name: Verify go.sum is tidy
        working-directory: supervisor
        run: |
          go mod tidy
          if ! git diff --quiet go.mod go.sum; then
            echo "go.mod or go.sum is out of date."
            git diff go.mod go.sum
            exit 1
          fi

      - name: go vet
        working-directory: supervisor
        run: go vet ./...

      # FIX: Pass -X main.Version so the supervisor build matches the engine.
      # supervisor/main.go must declare: var Version = "dev"
      - name: Build
        working-directory: supervisor
        run: go build -ldflags="-X main.Version=ci-test" ./...

      - name: Test
        working-directory: supervisor
        run: |
          if find . -name '*_test.go' | grep -q .; then
            go test -v -race ./...
          else
            echo "No tests yet — skipping."
          fi
