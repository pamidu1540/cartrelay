name: Go Build & Test

on:
  push:
    paths:
      - 'engine/**'
      - 'supervisor/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/go-build-test.yml'
  pull_request:
    paths:
      - 'engine/**'
      - 'supervisor/**'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('**/go.mod', '**/go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: Print repo structure (debug)
        run: find . -name 'go.mod' | sort

      - name: Tidy & Download Dependencies
        run: |
          # Run go mod tidy in every directory that has a go.mod
          find . -name 'go.mod' -not -path '*/.git/*' | while read modfile; do
            dir=$(dirname "$modfile")
            echo "=== Running go mod tidy in $dir ==="
            (cd "$dir" && go mod tidy && go mod download && go mod verify)
          done

      - name: Build all Go modules
        run: |
          find . -name 'go.mod' -not -path '*/.git/*' | while read modfile; do
            dir=$(dirname "$modfile")
            echo "=== Building in $dir ==="
            (cd "$dir" && go build ./...)
          done

      - name: Run Tests
        run: |
          find . -name 'go.mod' -not -path '*/.git/*' | while read modfile; do
            dir=$(dirname "$modfile")
            echo "=== Testing in $dir ==="
            if find "$dir" -name '*_test.go' | grep -q .; then
              (cd "$dir" && go test -v -race ./...)
            else
              echo "No test files in $dir — skipping."
            fi
          done
