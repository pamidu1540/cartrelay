name: Dependency Review

# ─────────────────────────────────────────────────────────────────────────────
# Runs only on pull requests. Compares the dependency snapshot between the
# base branch and the PR and blocks merge if any new dependency introduces
# a known vulnerability (CVE).
#
# This catches the case where you add a new package in go.mod or pyproject.toml
# that has a CVE before it ever lands on main.
# ─────────────────────────────────────────────────────────────────────────────

on:
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write    # allows posting a PR comment with findings

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          # Comment on the PR with a summary of new/removed dependencies
          comment-summary-in-pr: always
