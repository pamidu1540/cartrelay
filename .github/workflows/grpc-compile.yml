name: Compile gRPC Protocol Buffers

# FIX: Single workflow owns ALL proto generation.
# generate-python-proto.yml removed — two workflows committing on the same
# trigger causes non-fast-forward push race conditions.
on:
  push:
    paths:
      - 'engine/api/logistics.proto'
      - 'engine/api/buf.yaml'
      - 'engine/api/buf.gen.yaml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  BUF_VERSION: '1.34.0'

jobs:
  generate-proto:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: engine/go.sum

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # FIX: Use buf — so buf.yaml lint rules and buf.gen.yaml plugin config
      # are actually exercised in CI instead of bypassed with raw protoc.
      - name: Install buf CLI
        run: |
          curl -fsSL "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-Linux-x86_64" \
            -o /usr/local/bin/buf
          chmod +x /usr/local/bin/buf
          buf --version

      - name: Install Go protoc plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Install Python gRPC tools
        run: pip install grpcio-tools

      # Lint BEFORE generation — broken proto never gets committed.
      - name: buf lint
        working-directory: engine/api
        run: buf lint

      # Check for breaking changes vs main (only on non-main branches / PRs).
      - name: buf breaking
        if: github.ref != 'refs/heads/main'
        working-directory: engine/api
        run: |
          buf breaking \
            --against "https://github.com/${{ github.repository }}.git#branch=main,subdir=engine/api"

      - name: Generate Go bindings
        run: |
          cd engine/api
          protoc --proto_path=. \
            --go_out=. --go_opt=paths=source_relative \
            --go-grpc_out=. --go-grpc_opt=paths=source_relative \
            logistics.proto

      - name: Generate Python bindings
        run: |
          mkdir -p bot/src/api
          python -m grpc_tools.protoc \
            -Iengine/api \
            --python_out=bot/src/api \
            --grpc_python_out=bot/src/api \
            engine/api/logistics.proto
          touch bot/src/api/__init__.py

      # grpcio-tools known bug: generates absolute imports which break Python 3.
      - name: Fix Python 3 relative import
        run: |
          sed -i 's/^import logistics_pb2/from . import logistics_pb2/' \
            bot/src/api/logistics_pb2_grpc.py

      - name: Commit generated files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            engine/api/logistics.pb.go \
            engine/api/logistics_grpc.pb.go \
            bot/src/api/logistics_pb2.py \
            bot/src/api/logistics_pb2_grpc.py \
            bot/src/api/__init__.py
          if git diff --staged --quiet; then
            echo "No changes — nothing to commit."
          else
            git commit -m "chore: auto-generate proto bindings [skip ci]"
            git push
          fi
