name: Compile gRPC Protocol Buffers

# This action runs automatically whenever logistics.proto is modified
on:
  push:
    paths:
      - 'engine/api/logistics.proto'
  workflow_dispatch: # Allows you to run it manually from the GitHub UI

jobs:
  build-grpc:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Protoc Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Go gRPC Plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          # Add the Go bin directory to the system path
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Install Python gRPC Plugins
        run: |
          python -m pip install --upgrade pip
          python -m pip install grpcio-tools

      - name: Compile Go & Python Protobufs
        run: |
          # 1. Compile for Go (Outputs to engine/api)
          protoc --proto_path=engine/api \
            --go_out=engine/api --go_opt=paths=source_relative \
            --go-grpc_out=engine/api --go-grpc_opt=paths=source_relative \
            engine/api/logistics.proto

          # 2. Compile for Python (Outputs to bot/src/api)
          python -m grpc_tools.protoc \
            -Iengine/api \
            --python_out=bot/src/api \
            --grpc_python_out=bot/src/api \
            engine/api/logistics.proto

      - name: Fix Python imports (grpcio-tools bug workaround)
        run: |
          # The Python generator has a known bug with relative imports in Python 3.
          # This step automatically fixes the import inside logistics_pb2_grpc.py
          sed -i 's/import logistics_pb2 as logistics__pb2/from . import logistics_pb2 as logistics__pb2/g' bot/src/api/logistics_pb2_grpc.py

      - name: Commit and Push Generated Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Check if there are actually any changes to commit
          if git diff --exit-code; then
            echo "No changes in generated files. Skipping commit."
            exit 0
          fi
          
          git add engine/api/*.go bot/src/api/*.py
          git commit -m "chore: auto-generate gRPC proto files"
          git push
