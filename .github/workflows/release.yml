name: Release & Tag

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: engine/go.sum

      - name: Build engine binary (Linux amd64)
        working-directory: engine
        run: |
          mkdir -p ../dist
          GOOS=linux GOARCH=amd64 go build \
            -ldflags="-w -s -X main.Version=${{ github.ref_name }}" \
            -o ../dist/logistics-engine-linux-amd64 \
            ./...

      # FIX: supervisor/main.go must declare var Version = "dev" for this to work.
      # The -X flag is silently ignored if the variable doesn't exist.
      - name: Build supervisor binary (Linux amd64)
        working-directory: supervisor
        run: |
          mkdir -p ../dist
          GOOS=linux GOARCH=amd64 go build \
            -ldflags="-w -s -X main.Version=${{ github.ref_name }}" \
            -o ../dist/logistics-supervisor-linux-amd64 \
            ./...

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            CHANGELOG=$(git log --oneline --no-merges)
          else
            CHANGELOG=$(git log --oneline --no-merges "${PREV_TAG}..HEAD")
          fi
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # Also tag and push Docker images to GHCR on release.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push engine image (release tag)
        uses: docker/build-push-action@v6
        with:
          context: engine
          file: engine/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/engine:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}/engine:latest
          build-args: BUILD_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push bot image (release tag)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: bot/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/bot:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}/bot:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body: |
            ## What's Changed
            ${{ steps.changelog.outputs.CHANGELOG }}

            ## Docker images
            ```
            docker pull ghcr.io/${{ github.repository }}/engine:${{ github.ref_name }}
            docker pull ghcr.io/${{ github.repository }}/bot:${{ github.ref_name }}
            ```
          files: |
            dist/logistics-engine-linux-amd64
            dist/logistics-supervisor-linux-amd64
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
