name: Release

# ─────────────────────────────────────────────────────────────────────────────
# Triggered when you push a version tag: git tag v4.1.0 && git push --tags
#
# What it does (all automatically, no local work needed):
#   1. Builds Linux amd64 binaries for engine and supervisor
#   2. Pushes versioned Docker images to GHCR  (:v4.1.0 and :latest)
#   3. Creates a GitHub Release with the binaries attached and docker pull cmds
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    tags:
      - 'v*.*.*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io
  IMAGE_ENGINE: ghcr.io/${{ github.repository }}/engine
  IMAGE_BOT:    ghcr.io/${{ github.repository }}/bot

jobs:
  release:
    name: Build binaries, push images, create release
    runs-on: ubuntu-latest
    permissions:
      contents: write    # create GitHub Release + upload assets
      packages: write    # push to GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: |
            engine/go.sum
            supervisor/go.sum

# ── Binaries ────────────────────────────────────────────────────────
      - name: Build engine binary (linux/amd64)
        working-directory: engine
        run: |
          mkdir -p ../dist
          GOOS=linux GOARCH=amd64 go build \
            -ldflags="-w -s -X main.Version=${{ github.ref_name }}" \
            -o ../dist/logistics-engine-linux-amd64 \
            .

      - name: Build supervisor binary (linux/amd64)
        working-directory: supervisor
        run: |
          GOOS=linux GOARCH=amd64 go build \
            -ldflags="-w -s -X main.Version=${{ github.ref_name }}" \
            -o ../dist/logistics-supervisor-linux-amd64 \
            .

      # ── Docker images ────────────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare release .env
        working-directory: deploy
        run: |
          cp .env.example .env
          sed -i 's|^TELEGRAM_BOT_TOKEN=.*|TELEGRAM_BOT_TOKEN=stub_release_token|'                  .env
          sed -i 's|^INTERNAL_TOKEN=.*|INTERNAL_TOKEN=stub_release_internal_000000000000000000000|' .env
          sed -i 's|^MAPBOX_TOKEN=.*|MAPBOX_TOKEN=stub_release_mapbox|'                             .env
          sed -i 's|^BUILD_VERSION=.*|BUILD_VERSION=${{ github.ref_name }}|'                        .env
          sed -i 's|^# DEV_BYPASS_SECRET=.*|DEV_BYPASS_SECRET=stub_release_bypass_secret_0000000|'  .env
          sed -i 's|^# SKIP_LICENSE_CHECK=.*|SKIP_LICENSE_CHECK=stub_release_bypass_secret_0000000|' .env

      - name: Build & push engine image
        uses: docker/build-push-action@v6
        with:
          context: engine
          file: engine/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_ENGINE }}:${{ github.ref_name }}
            ${{ env.IMAGE_ENGINE }}:latest
          build-args: BUILD_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push bot image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: bot/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BOT }}:${{ github.ref_name }}
            ${{ env.IMAGE_BOT }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Changelog ────────────────────────────────────────────────────────
      - name: Generate changelog
        id: changelog
        run: |
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV" ]; then
            LOG=$(git log --oneline --no-merges | head -30)
          else
            LOG=$(git log --oneline --no-merges "${PREV}..HEAD")
          fi
          {
            echo "CHANGELOG<<EOF"
            echo "$LOG"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      # ── Cloudflare R2 Distribution ─────────────────────────────────────────
      - name: Upload Binaries to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          echo "Initiating secure upload to Cloudflare R2..."
          
          # Base endpoint URL for your specific Cloudflare account
          ENDPOINT="https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          BUCKET="s3://${{ secrets.R2_BUCKET_NAME }}/${{ github.ref_name }}"
          
          # 1. Upload the engine binary
          aws s3 cp ./dist/logistics-engine-linux-amd64 $BUCKET/logistics-engine-linux-amd64 \
            --endpoint-url $ENDPOINT
            
          # 2. Upload the supervisor binary
          aws s3 cp ./dist/logistics-supervisor-linux-amd64 $BUCKET/logistics-supervisor-linux-amd64 \
            --endpoint-url $ENDPOINT
            
          # 3. Upload the installation script
          aws s3 cp ./install.sh $BUCKET/install.sh \
            --endpoint-url $ENDPOINT
            
          # 4. Mirror to a 'latest' folder for static CDN URLs
          aws s3 cp ./dist/logistics-supervisor-linux-amd64 s3://${{ secrets.R2_BUCKET_NAME }}/latest/supervisor \
            --endpoint-url $ENDPOINT
          aws s3 cp ./install.sh s3://${{ secrets.R2_BUCKET_NAME }}/latest/install.sh \
            --endpoint-url $ENDPOINT

          echo "✅ Upload complete!"
