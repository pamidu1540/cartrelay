name: Release

# ─────────────────────────────────────────────────────────────────────────────
# Triggered when you push a version tag: git tag v4.3.2 && git push --tags
#
# What it does (all automatically, no local work needed):
#   1. Builds Linux amd64 binaries for engine and supervisor
#   2. Pushes versioned Docker images to GHCR  (:v4.3.2 and :latest)
#   3. Creates a GitHub Release with binaries attached and docker pull cmds
#   4. Uploads binaries + install.sh to Cloudflare R2
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io
  IMAGE_ENGINE: ghcr.io/${{ github.repository }}/engine
  IMAGE_BOT:    ghcr.io/${{ github.repository }}/bot

jobs:
  release:
    name: Build binaries, push images, create release
    runs-on: ubuntu-latest
    permissions:
      contents: write    # create GitHub Release + upload assets
      packages: write    # push to GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true
          cache-dependency-path: |
            engine/go.sum
            supervisor/go.sum

      # ── Protobuf ────────────────────────────────────────────────────────────
      - name: Generate Go proto bindings
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.3
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
          
          protoc --proto_path=engine/api \
            --go_out=engine/api     --go_opt=paths=source_relative \
            --go-grpc_out=engine/api --go-grpc_opt=paths=source_relative \
            engine/api/logistics.proto

      # ── Binaries ──────────────────────────────────────────────────────────
      - name: Build engine binary (linux/amd64)
        working-directory: engine
        run: |
          mkdir -p ../dist
          GOOS=linux GOARCH=amd64 go build \
            -ldflags="-w -s -X main.Version=${{ github.ref_name }}" \
            -o ../dist/logistics-engine-linux-amd64 \
            .

      - name: Build engine binary (linux/arm64)
        working-directory: engine
        run: |
          GOOS=linux GOARCH=arm64 go build \
            -ldflags="-w -s -X main.Version=${{ github.ref_name }}" \
            -o ../dist/logistics-engine-linux-arm64 \
            .

      - name: Build supervisor binary (linux/amd64)
        working-directory: supervisor
        run: |
          GOOS=linux GOARCH=amd64 go build \
            -ldflags="-w -s -X main.Version=${{ github.ref_name }}" \
            -o ../dist/logistics-supervisor-linux-amd64 \
            .

      - name: Build supervisor binary (linux/arm64)
        working-directory: supervisor
        run: |
          GOOS=linux GOARCH=arm64 go build \
            -ldflags="-w -s -X main.Version=${{ github.ref_name }}" \
            -o ../dist/logistics-supervisor-linux-arm64 \
            .

      # ── Docker images ──────────────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}



      - name: Build & push engine image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: engine/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_ENGINE }}:${{ github.ref_name }}
            ${{ env.IMAGE_ENGINE }}:latest
          build-args: BUILD_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push bot image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: bot/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BOT }}:${{ github.ref_name }}
            ${{ env.IMAGE_BOT }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Changelog ──────────────────────────────────────────────────────────
      - name: Generate changelog
        id: changelog
        run: |
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV" ]; then
            LOG=$(git log --oneline --no-merges | head -30)
          else
            LOG=$(git log --oneline --no-merges "${PREV}..HEAD")
          fi
          {
            echo "CHANGELOG<<EOF"
            echo "$LOG"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      # ── GitHub Release ─────────────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            ## What's changed
            ${{ steps.changelog.outputs.CHANGELOG }}

            ## Docker images
            ```
            docker pull ghcr.io/${{ github.repository }}/engine:${{ github.ref_name }}
            docker pull ghcr.io/${{ github.repository }}/bot:${{ github.ref_name }}
            ```
          files: |
            dist/logistics-engine-linux-amd64
            dist/logistics-engine-linux-arm64
            dist/logistics-supervisor-linux-amd64
            dist/logistics-supervisor-linux-arm64
          fail_on_unmatched_files: true

      # ── OTA Package Generation ───────────────────────────────────────────────
      - name: Generate OTA Package
        run: |
          mkdir -p ota_payload
          cat > ota_payload/docker-compose.yml << 'COMPOSE'
          services:
            postgres:
              image: postgres:16-alpine
              restart: unless-stopped
              environment:
                - POSTGRES_USER=${POSTGRES_USER}
                - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
                - POSTGRES_DB=${POSTGRES_DB}
              volumes:
                - postgres_data:/var/lib/postgresql/data
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
                interval: 10s
                timeout: 5s
                retries: 5
                start_period: 15s
              networks: [backend]
            engine:
              image: ${{ env.IMAGE_ENGINE }}:${{ github.ref_name }}
              container_name: logistics_engine
              restart: unless-stopped
              environment:
                - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
                - INTERNAL_TOKEN=${INTERNAL_TOKEN}
                - MAPBOX_TOKEN=${MAPBOX_TOKEN}
                - ADMIN_USER_IDS=${ADMIN_USER_IDS}
                - LICENSE_PUBLIC_KEY=${LICENSE_PUBLIC_KEY:-}
                - BUILD_VERSION=${{ github.ref_name }}
              volumes:
                - sockets:/app/sockets
                - backups:/app/backups
              depends_on:
                postgres:
                  condition: service_healthy
              healthcheck:
                test: ["CMD-SHELL", "test -S /app/sockets/logistics.sock"]
                interval: 10s
                timeout: 5s
                retries: 6
                start_period: 20s
              networks: [backend]
            bot:
              image: ${{ env.IMAGE_BOT }}:${{ github.ref_name }}
              container_name: logistics_bot
              restart: unless-stopped
              environment:
                - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
                - INTERNAL_TOKEN=${INTERNAL_TOKEN}
                - ENGINE_SOCKET=/app/sockets/logistics.sock
              volumes:
                - sockets:/app/sockets:ro
              depends_on:
                engine:
                  condition: service_healthy
              networks: [backend]
          volumes:
            postgres_data: {driver: local}
            sockets:       {driver: local}
            backups:       {driver: local}
          networks:
            backend:
              driver: bridge
          COMPOSE
          tar -czf update.tar.gz -C ota_payload docker-compose.yml
          
          # Sign the tarball
          SIG=$(go run .github/scripts/sign_ota.go update.tar.gz "${{ secrets.OTA_PRIVATE_KEY }}")
          
          # Generate manifest
          cat > manifest.json << MANIFEST
          {
            "version": "${{ github.ref_name }}",
            "url": "https://pub-cd7e4ed255b541cfaed526741f32d2f1.r2.dev/${{ github.ref_name }}/update.tar.gz",
            "signature": "$SIG"
          }
          MANIFEST

      # ── Cloudflare R2 Distribution ─────────────────────────────────────────
      - name: Upload Binaries to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          echo "Initiating secure upload to Cloudflare R2..."

          ENDPOINT="https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          BUCKET="s3://${{ secrets.R2_BUCKET_NAME }}/${{ github.ref_name }}"

          # 1. Upload the engine binaries (amd64 + arm64)
          aws s3 cp ./dist/logistics-engine-linux-amd64 $BUCKET/logistics-engine-linux-amd64 \
            --endpoint-url $ENDPOINT
          aws s3 cp ./dist/logistics-engine-linux-arm64 $BUCKET/logistics-engine-linux-arm64 \
            --endpoint-url $ENDPOINT

          # 2. Upload the supervisor binaries (amd64 + arm64)
          aws s3 cp ./dist/logistics-supervisor-linux-amd64 $BUCKET/logistics-supervisor-linux-amd64 \
            --endpoint-url $ENDPOINT
          aws s3 cp ./dist/logistics-supervisor-linux-arm64 $BUCKET/logistics-supervisor-linux-arm64 \
            --endpoint-url $ENDPOINT

          # 3. Upload the installation script
          aws s3 cp ./install.sh $BUCKET/install.sh \
            --endpoint-url $ENDPOINT

          # 4. Mirror to a 'latest' folder for static CDN URLs
          aws s3 cp ./dist/logistics-supervisor-linux-amd64 s3://${{ secrets.R2_BUCKET_NAME }}/latest/supervisor-amd64 \
            --endpoint-url $ENDPOINT
          aws s3 cp ./dist/logistics-supervisor-linux-arm64 s3://${{ secrets.R2_BUCKET_NAME }}/latest/supervisor-arm64 \
            --endpoint-url $ENDPOINT
          aws s3 cp ./install.sh s3://${{ secrets.R2_BUCKET_NAME }}/latest/install.sh \
            --endpoint-url $ENDPOINT

          # 5. Upload OTA updates
          aws s3 cp ./update.tar.gz $BUCKET/update.tar.gz \
            --endpoint-url $ENDPOINT
          aws s3 cp ./manifest.json s3://${{ secrets.R2_BUCKET_NAME }}/latest/manifest.json \
            --endpoint-url $ENDPOINT

          echo "✅ Upload complete!"
