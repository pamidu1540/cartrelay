name: Python Lint & Test

on:
  push:
    paths:
      - 'bot/**'
      - '.github/workflows/python-lint-test.yml'
  pull_request:
    paths:
      - 'bot/**'

jobs:
  lint-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          # FIX: cache on pyproject.toml — requirements.txt does not exist.
          cache-dependency-path: bot/pyproject.toml

      - name: Install dependencies
        working-directory: bot
        run: |
          python -m pip install --upgrade pip
          # FIX: install from pyproject.toml, not requirements.txt
          pip install -e ".[dev]"
          # grpc stubs needed for import resolution during lint
          pip install grpcio grpcio-tools
          # Generate pb2 stubs so ruff/mypy can resolve api imports
          mkdir -p src/api
          python -m grpc_tools.protoc \
            -I../engine/api \
            --python_out=src/api \
            --grpc_python_out=src/api \
            ../engine/api/logistics.proto
          touch src/api/__init__.py
          sed -i 's/^import logistics_pb2/from . import logistics_pb2/' \
            src/api/logistics_pb2_grpc.py

      # FIX: Use ruff — declared in pyproject.toml dev-dependencies, not flake8.
      - name: Lint with ruff
        working-directory: bot
        run: |
          ruff check src/ --output-format=github

      - name: Run tests
        working-directory: bot
        run: |
          if [ -d tests ]; then
            pytest tests/ -v
          else
            echo "No tests directory yet — skipping pytest."
          fi
