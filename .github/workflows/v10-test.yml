name: v10 Load Test

# ─────────────────────────────────────────────────────────────────────────────
# This workflow is EXCLUSIVELY for the v10-rewrite branch.
#
# v10 Architecture differences vs v5/main:
#   • PostgreSQL instead of SQLite            → no SQLite contention test
#   • Unix domain socket (not TCP port 50051) → connect via unix://...
#   • CatalogRequest uses page/page_size      → no page_token field
#   • QuoteRequest uses user_lat/user_lon     → no destination_lat/lon
#   • SaveCartRequest uses int64 user_id      → no string cast
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [v10-rewrite]
    paths:
      - 'engine/**'
      - 'load_test/**'
      - 'deploy/**'
      - '.github/workflows/v10-test.yml'
  workflow_dispatch:
    inputs:
      scenario:
        description: "Load scenario to run"
        required: true
        default: "full"
        type: choice
        options:
          - full
          - grpc-only
          - spike
      max_users:
        description: "Peak concurrent users"
        required: true
        default: "256"
      duration_seconds:
        description: "Sustained load duration (seconds)"
        required: true
        default: "60"
  schedule:
    # Run nightly at 03:00 UTC (offset from main branch test at 02:00 UTC)
    - cron: "0 3 * * *"

concurrency:
  group: v10-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  v10-load-test:
    name: "v10 Load Test (${{ github.event.inputs.scenario || 'full' }})"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SCENARIO:           ${{ github.event.inputs.scenario || 'full' }}
      MAX_USERS:          ${{ github.event.inputs.max_users || '256' }}
      DURATION_SECS:      ${{ github.event.inputs.duration_seconds || '60' }}
      INTERNAL_TOKEN:     load-test-token-ci
      TELEGRAM_BOT_TOKEN: "0:not-used-in-load-test"
      MAPBOX_TOKEN:       "pk.not-used-in-load-test"
      ADMIN_USER_IDS:     "1"
      DEPLOY_ENV:         ci
      POSTGRES_USER:      logistics
      POSTGRES_PASSWORD:  logistics
      POSTGRES_DB:        logistics
      # v10 uses a Unix socket — all scripts must use this path
      ENGINE_SOCKET:      ${{ github.workspace }}/deploy/sockets/logistics.sock
      PYTHONPATH:         load_test/scripts

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────────
      - name: Checkout v10-rewrite
        uses: actions/checkout@v4
        with:
          ref: v10-rewrite

      # ── Tooling ──────────────────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          # Pin grpcio + grpcio-tools to the SAME version to avoid
          # protobuf gencode/runtime major version mismatch (v5 vs v6).
          pip install \
            grpcio==1.71.0 \
            grpcio-tools==1.71.0 \
            protobuf==5.29.3 \
            aiohttp matplotlib pandas jinja2 --quiet

      # ── Write .env ───────────────────────────────────────────────────────────
      - name: Write deploy/.env
        run: |
          mkdir -p deploy/sockets
          cat > deploy/.env <<EOF
          TELEGRAM_BOT_TOKEN=${{ env.TELEGRAM_BOT_TOKEN }}
          INTERNAL_TOKEN=${{ env.INTERNAL_TOKEN }}
          MAPBOX_TOKEN=${{ env.MAPBOX_TOKEN }}
          ADMIN_USER_IDS=${{ env.ADMIN_USER_IDS }}
          DEPLOY_ENV=${{ env.DEPLOY_ENV }}
          POSTGRES_USER=${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB=${{ env.POSTGRES_DB }}
          LOG_LEVEL=info
          EOF

      # ── Build & start stack ───────────────────────────────────────────────────
      - name: Build & start Docker Compose stack
        run: |
          cd deploy
          docker compose up -d --build
          echo "Waiting for engine Unix socket to appear (max 60s)..."
          for i in $(seq 1 30); do
            if [ -S "${{ env.ENGINE_SOCKET }}" ]; then
              echo "✓ Engine socket ready after ${i}s × 2 = $((i*2))s"
              break
            fi
            sleep 2
          done
          if [ ! -S "${{ env.ENGINE_SOCKET }}" ]; then
            echo "✗ Engine socket never appeared"
            cd .. && docker compose -f deploy/docker-compose.yml logs
            exit 1
          fi

      - name: Fix socket permissions
        run: |
          sudo chmod 666 "${{ env.ENGINE_SOCKET }}"

      # ── Generate protobuf stubs ───────────────────────────────────────────────
      - name: Generate Python protobuf stubs
        run: |
          mkdir -p load_test/scripts/api
          python3 -m grpc_tools.protoc \
            -I engine/api \
            --python_out=load_test/scripts/api \
            --grpc_python_out=load_test/scripts/api \
            engine/api/logistics.proto
          touch load_test/scripts/api/__init__.py

      # ── Seed test data ────────────────────────────────────────────────────────
      - name: Seed test data (items + warehouse)
        run: |
          python3 load_test/scripts/seed_data.py \
            --token  "${{ env.INTERNAL_TOKEN }}" \
            --items  50 \
            --users  500 \
            --host   "unix://${{ env.ENGINE_SOCKET }}"

      # ── Run load tests ────────────────────────────────────────────────────────
      - name: Run gRPC load test
        if: env.SCENARIO == 'full' || env.SCENARIO == 'grpc-only'
        run: |
          mkdir -p load_test/results
          python3 load_test/scripts/run_grpc_load.py \
            --token      "${{ env.INTERNAL_TOKEN }}" \
            --host       "unix://${{ env.ENGINE_SOCKET }}" \
            --max-users  "${{ env.MAX_USERS }}" \
            --duration   "${{ env.DURATION_SECS }}" \
            --output     load_test/results/grpc_results.json

      - name: Run spike test (0→MAX_USERS in 5s)
        if: env.SCENARIO == 'full' || env.SCENARIO == 'spike'
        run: |
          mkdir -p load_test/results
          python3 load_test/scripts/run_spike_test.py \
            --token        "${{ env.INTERNAL_TOKEN }}" \
            --host         "unix://${{ env.ENGINE_SOCKET }}" \
            --peak-users   "${{ env.MAX_USERS }}" \
            --ramp-seconds 5 \
            --output       load_test/results/spike_results.json

      # ── Collect engine metrics ────────────────────────────────────────────────
      - name: Collect Docker & engine metrics
        if: always()
        run: |
          mkdir -p load_test/results
          docker stats --no-stream --format json > load_test/results/docker_stats.json || true
          docker compose -f deploy/docker-compose.yml logs --no-color > \
            load_test/results/engine_logs.txt 2>&1 || true
          python3 load_test/scripts/parse_engine_logs.py \
            --input  load_test/results/engine_logs.txt \
            --output load_test/results/log_metrics.json || true

      # ── Generate HTML report ──────────────────────────────────────────────────
      - name: Generate HTML report
        if: always()
        run: |
          python3 load_test/scripts/generate_report.py \
            --results-dir load_test/results \
            --scenario    "${{ env.SCENARIO }}" \
            --max-users   "${{ env.MAX_USERS }}" \
            --duration    "${{ env.DURATION_SECS }}" \
            --commit      "${{ github.sha }}" \
            --run-id      "${{ github.run_id }}" \
            --output      load_test/results/report.html || true

      # ── GitHub Actions Job Summary ────────────────────────────────────────────
      - name: Write job summary
        if: always()
        run: |
          python3 load_test/scripts/write_summary.py \
            --results-dir load_test/results \
            >> $GITHUB_STEP_SUMMARY || true

      # ── Upload artifacts ──────────────────────────────────────────────────────
      - name: Upload load test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v10-load-test-report-${{ github.run_id }}
          path: load_test/results/
          retention-days: 30

      # ── Assert thresholds ─────────────────────────────────────────────────────
      - name: Assert performance thresholds
        run: |
          python3 load_test/scripts/assert_thresholds.py \
            --results-dir    load_test/results \
            --p99-max-ms     1000 \
            --error-rate-max 0.01

      # ── Teardown ──────────────────────────────────────────────────────────────
      - name: Teardown stack
        if: always()
        run: |
          cd deploy && docker compose down -v
