name: Mark Stale Issues and PRs

on:
  schedule:
    - cron: '0 8 * * 1'   # Every Monday 08:00 UTC
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Stale issues and PRs
    runs-on: ubuntu-latest

    steps:
      - name: Mark stale issues and pull requests
        uses: actions/stale@v9
        with:
          stale-issue-message: >
            This issue has been automatically marked as stale because it has
            not had any activity in 30 days. It will be closed in 7 days unless
            it is updated. Thank you for your contributions!
          stale-pr-message: >
            This pull request has been automatically marked as stale because it
            has not had any activity in 14 days. It will be closed in 7 days
            unless it is updated or someone requests a review. Thank you!
          close-issue-message: >
            This issue has been automatically closed due to inactivity.
            Please reopen it if it is still relevant.
          close-pr-message: >
            This pull request has been automatically closed due to inactivity.
            Please reopen it if you would like to continue working on it.
          days-before-issue-stale: 30
          days-before-pr-stale: 14
          days-before-issue-close: 7
          days-before-pr-close: 7
          # Never mark these labels as stale
          exempt-issue-labels: 'pinned,security,bug,in-progress'
          exempt-pr-labels: 'pinned,security,in-progress'
          # Only process issues/PRs that match
          operations-per-run: 100
