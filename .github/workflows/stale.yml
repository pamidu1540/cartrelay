name: Stale Issues & PRs

on:
  schedule:
    # Runs every day at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: Mark and close stale issues and PRs
        uses: actions/stale@v9
        with:
          # Issues
          days-before-issue-stale: 30
          days-before-issue-close: 7
          stale-issue-label: 'stale'
          stale-issue-message: >
            This issue has had no activity for 30 days and has been marked as stale.
            It will be closed in 7 days unless there is further activity.
          close-issue-message: >
            This issue has been automatically closed due to inactivity.
            Feel free to reopen it if it is still relevant.

          # Pull Requests
          days-before-pr-stale: 14
          days-before-pr-close: 7
          stale-pr-label: 'stale'
          stale-pr-message: >
            This pull request has had no activity for 14 days and has been marked as stale.
            It will be closed in 7 days unless there is further activity.
          close-pr-message: >
            This pull request has been automatically closed due to inactivity.
            Feel free to reopen it if you'd like to continue the work.

          # Never mark issues/PRs with these labels as stale
          exempt-issue-labels: 'pinned,security,bug'
          exempt-pr-labels: 'pinned,security,work-in-progress'
