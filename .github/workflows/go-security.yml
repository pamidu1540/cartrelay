name: Go Security Scan

on:
  push:
    paths:
      - 'engine/**'
      - '.github/workflows/go-security.yml'
  pull_request:
    paths:
      - 'engine/**'
  schedule:
    - cron: '0 8 * * 1'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Find go.mod root
        id: modroot
        run: |
          MOD=$(find . -name 'go.mod' | head -1)
          ROOT=$(dirname "$MOD")
          echo "root=$ROOT" >> $GITHUB_OUTPUT

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-sec-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: go-sec-${{ runner.os }}-

      - name: Tidy dependencies
        working-directory: ${{ steps.modroot.outputs.root }}
        run: go mod tidy

      - name: Install & run govulncheck
        working-directory: ${{ steps.modroot.outputs.root }}
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  gosec:
    name: gosec
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Find go.mod root
        id: modroot
        run: |
          MOD=$(find . -name 'go.mod' | head -1)
          ROOT=$(dirname "$MOD")
          echo "root=$ROOT" >> $GITHUB_OUTPUT

      - name: Tidy dependencies
        working-directory: ${{ steps.modroot.outputs.root }}
        run: go mod tidy

      - name: Install & run gosec
        working-directory: ${{ steps.modroot.outputs.root }}
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec ./...
