name: Go Security Scan

on:
  push:
    paths:
      - 'engine/**'
      - 'supervisor/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/go-security.yml'
  pull_request:
    paths:
      - 'engine/**'
      - 'supervisor/**'
  schedule:
    - cron: '0 8 * * 1'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-sec-${{ runner.os }}-${{ hashFiles('**/go.mod', '**/go.sum') }}
          restore-keys: go-sec-${{ runner.os }}-

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck on all modules
        run: |
          find . -name 'go.mod' -not -path '*/.git/*' | while read modfile; do
            dir=$(dirname "$modfile")
            echo "=== govulncheck in $dir ==="
            (cd "$dir" && go mod tidy && govulncheck ./...)
          done

  gosec:
    name: gosec
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Run gosec on all modules
        run: |
          find . -name 'go.mod' -not -path '*/.git/*' | while read modfile; do
            dir=$(dirname "$modfile")
            echo "=== gosec in $dir ==="
            (cd "$dir" && go mod tidy && gosec ./...)
          done
