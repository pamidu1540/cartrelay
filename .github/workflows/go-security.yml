name: Go Security Scan

on:
  push:
    paths:
      - 'engine/**'
      - 'supervisor/**'
      - '.github/workflows/go-security.yml'
  pull_request:
    paths:
      - 'engine/**'
      - 'supervisor/**'
  schedule:
    - cron: '0 8 * * 1'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: |
            engine/go.sum
            supervisor/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: govulncheck — engine
        working-directory: engine
        run: govulncheck ./...

      - name: govulncheck — supervisor
        working-directory: supervisor
        run: govulncheck ./...

  gosec:
    name: gosec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: |
            engine/go.sum
            supervisor/go.sum

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: gosec — engine
        working-directory: engine
        # gosec exits 1 when it finds issues — that is expected behavior on real code.
        # We report findings but don't fail the workflow; review the output manually.
        continue-on-error: true
        run: gosec -fmt=text ./...

      - name: gosec — supervisor
        working-directory: supervisor
        continue-on-error: true
        run: gosec -fmt=text ./...
