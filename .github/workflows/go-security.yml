name: Go Security Scan

on:
  push:
    paths:
      - 'engine/**'
      - 'supervisor/**'
      - '.github/workflows/go-security.yml'
  pull_request:
    paths:
      - 'engine/**'
      - 'supervisor/**'
  schedule:
    - cron: '0 8 * * 1'   # Every Monday 08:00 UTC

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.11'
          cache: true
          cache-dependency-path: |
            engine/go.sum
            supervisor/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: govulncheck — engine
        working-directory: engine
        run: govulncheck ./...

      - name: govulncheck — supervisor
        working-directory: supervisor
        run: govulncheck ./...

  gosec:
    name: gosec
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # needed to upload SARIF results
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.11'
          cache: true
          cache-dependency-path: |
            engine/go.sum
            supervisor/go.sum

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      # Run gosec to scan for security vulnerabilities.
      # High/critical severity findings will block the build (exit 1 default).
      - name: gosec — engine (SARIF)
        working-directory: engine
        run: gosec -exclude-dir=api -fmt=sarif -out=gosec-engine.sarif ./...

      - name: gosec — supervisor (SARIF)
        working-directory: supervisor
        run: gosec -fmt=sarif -out=gosec-supervisor.sarif ./...

      - name: Upload engine SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: engine/gosec-engine.sarif
          category: gosec-engine

      - name: Upload supervisor SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: supervisor/gosec-supervisor.sarif
          category: gosec-supervisor
