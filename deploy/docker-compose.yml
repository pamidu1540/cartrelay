# deploy/docker-compose.yml — v5
# BUG-021: healthchecks on every service; bot depends_on engine healthy
# SEC-013: DEV_BYPASS_SECRET / SKIP_LICENSE_CHECK absent from this file
# PERF-011: build context is the repo root; .dockerignore trims it

services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [backend]

  engine:
    build:
      context: ..
      dockerfile: engine/Dockerfile
      args:
        VERSION: ${APP_VERSION:-dev}
    restart: unless-stopped
    environment:
      DATABASE_URL:       postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      INTERNAL_TOKEN:     ${INTERNAL_TOKEN}
      MAPBOX_TOKEN:       ${MAPBOX_TOKEN}
      ADMIN_USER_IDS:     ${ADMIN_USER_IDS}
      LICENSE_PUBLIC_KEY: ${LICENSE_PUBLIC_KEY:-}
      TLS_CERT_FILE:      ${TLS_CERT_FILE:-}
      TLS_KEY_FILE:       ${TLS_KEY_FILE:-}
      DEPLOY_ENV:         ${DEPLOY_ENV:-production}
      LOG_LEVEL:          ${LOG_LEVEL:-info}
    volumes:
      - ./sockets:/app/sockets
      - backups:/app/backups
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -S /app/sockets/logistics.sock"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks: [backend]

  bot:
    build:
      context: ..
      dockerfile: bot/Dockerfile
      args:
        VERSION: ${APP_VERSION:-dev}
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      INTERNAL_TOKEN:     ${INTERNAL_TOKEN}
      ENGINE_SOCKET:      /app/sockets/logistics.sock
      TLS_CERT_FILE:      ${TLS_CERT_FILE:-}
      LOG_LEVEL:          ${LOG_LEVEL:-info}
      DEFAULT_LAT:        ${DEFAULT_LAT:-6.9271}
      DEFAULT_LON:        ${DEFAULT_LON:-79.8612}
    volumes:
      - ./sockets:/app/sockets:ro
    depends_on:
      engine:
        condition: service_healthy
    networks: [backend]

volumes:
  postgres_data:
  backups:

networks:
  backend:
    driver: bridge
