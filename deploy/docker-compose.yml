services:
  engine:
    build:
      context: ../engine
      dockerfile: Dockerfile
    container_name: logistics_engine
    restart: always
    environment:
      - MAPBOX_TOKEN=${MAPBOX_TOKEN}
      - INTERNAL_TOKEN=${INTERNAL_TOKEN}
    volumes:
      - shared_sockets:/app/sockets
      - engine_data:/app/data

  bot:
    build:
      context: ../bot
      dockerfile: Dockerfile
    container_name: logistics_bot
    restart: always
    environment:
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - INTERNAL_TOKEN=${INTERNAL_TOKEN}
    volumes:
      - shared_sockets:/app/sockets
    depends_on:
      - engine

volumes:
  shared_sockets:
  engine_data: