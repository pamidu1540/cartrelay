services:
  postgres:
    image: postgres:16-alpine
    container_name: local_postgres
    restart: unless-stopped
    command: ["postgres", "-c", "max_connections=100", "-c", "shared_buffers=32MB", "-c", "work_mem=2MB", "-c", "maintenance_work_mem=8MB", "-c", "effective_cache_size=64MB"]
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [local_backend]

  engine:
    build:
      context: ..
      dockerfile: engine/Dockerfile
    container_name: local_engine
    restart: unless-stopped
    env_file: .env
    environment:
      - GOMEMLIMIT=48MiB
      - GOGC=50
      - DATABASE_URL=postgres://${POSTGRES_USER}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      - PGPASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - sockets:/app/sockets
      - backups:/app/backups
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -S /app/sockets/logistics.sock"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks: [local_backend]

  bot:
    build:
      context: ..
      dockerfile: bot/Dockerfile
    container_name: local_bot
    restart: unless-stopped
    env_file: .env
    environment:
      - ENGINE_SOCKET=/app/sockets/logistics.sock
    volumes:
      - sockets:/app/sockets:ro
    depends_on:
      engine:
        condition: service_healthy
    networks: [local_backend]

volumes:
  postgres_data: {driver: local}
  sockets:       {driver: local}
  backups:       {driver: local}

networks:
  local_backend:
    driver: bridge
