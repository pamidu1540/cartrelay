# CartRelay development store. Settings may come from .env or the shell.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [local_backend]

  engine:
    build:
      context: ..
      dockerfile: engine/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      PGPASSWORD: ${POSTGRES_PASSWORD}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?Set INTERNAL_TOKEN}
      ADMIN_USER_IDS: ${ADMIN_USER_IDS:?Set ADMIN_USER_IDS}
      MAPBOX_TOKEN: ${MAPBOX_TOKEN:-}
      DEPLOY_ENV: local_dev
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - sockets:/app/sockets
      - backups:/app/backups
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -S /app/sockets/logistics.sock"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks: [local_backend]

  bot:
    build:
      context: ..
      dockerfile: bot/Dockerfile
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?Set INTERNAL_TOKEN}
      ENGINE_SOCKET: /app/sockets/logistics.sock
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DEFAULT_LAT: ${DEFAULT_LAT:-6.9271}
      DEFAULT_LON: ${DEFAULT_LON:-79.8612}
    volumes:
      - sockets:/app/sockets:ro
    depends_on:
      engine:
        condition: service_healthy
    networks: [local_backend]

volumes:
  postgres_data:
  sockets:
  backups:

networks:
  local_backend:
    driver: bridge
